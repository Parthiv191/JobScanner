# What to watch on https://www.intern-list.com/ and what counts as worth an email.
#
# lists: the site's short names (the ?k= value in its URLs). US lists only.
#   eng  = Engineering and Development   swe = Software Engineering
#   cs   = Cybersecurity            aiml = Machine Learning and AI
#   (run `python -m jobscanner --show-lists` to see them all; there's no separate
#   electrical or hardware list, so EE roles come from eng, plus swe's embedded/firmware ones)
# Jobs come from jobright.ai, which powers the site's job tables.
# Optional per list: title_include (keep only titles containing any of these)
# and title_exclude (drop titles containing any of these). Case-insensitive.
#
# Words match anywhere in the title, even inside other words: "ic" would match
# "electrical" and "public", "rf" would match "performance". So short terms are written
# as phrases ("ic design") or with a space on one side ("rf ", " rf"), which needs quotes.
# An exclude always wins over an include.

lists:
  - key: eng
    # The EE words, shared by every list below (&ee_words names the list; *ee_words reuses it).
    title_include: &ee_words [
      # electrical and electronics in general
      electric, electronic, hardware, " hw", "hw/", computer engineer,
      # analog, mixed-signal, power
      analog, mixed-signal, signal, power, pmic, battery, motor control,
      # chips
      circuit, silicon, semiconductor, ic design, ic layout, ic test, ic validation, ic verification,
      analog ic, power ic, rfic, asic, vlsi, fpga, "rtl ", " rtl", soc design, soc engineer, physical design,
      digital design, soft ip, pmu, dram, hbm, gpu architecture, computer architecture,
      # RF and signals
      "rf ", " rf", "rf/", microwave, antenna, radar, dsp,
      # board level
      pcb, layout, embedded, firmware,
      # test, validation, product and applications engineering
      verification, validation, characterization, design evaluation, test, failure analysis,
      applications engineer, application engineer, product engineer,
      # adjacent hardware
      photonic, optical, sensor, microsystems, microfabrication, avionics, mechatronics,
    ]
    title_exclude: &not_ee [
      # software, data and business roles
      frontend, front end, front-end, backend, back end, back-end, full stack, full-stack, fullstack,
      data scientist, data science, data analyst, data engineer, systems administrator,
      marketing, sales, finance, financial, accounting, cybersecurity, cyber security,
      # software QA and test software (hardware test stays: "Hardware/Software Testing" passes)
      software test intern, software testing engineer, software qa, qa, engineer in test, test software,
      # not intern-level ("senior" alone would drop "Senior Technical Intern - Firmware")
      senior engineer, staff engineer, manager, research scientist,
      # "power", "test" and "sensor" in non-EE titles
      power bi, powerbi, powerapps, power apps, power platform, power automate,
      construction materials, materials testing, civil engineer, sensory,
      flight test, propulsion test, gas turbine,
      # one-offs seen in real postings
      model validation, middleware, ai product, ai application, electronic data,
    ]
  - key: swe
    title_include: *ee_words
    title_exclude: *not_ee
  # A community GitHub list of brand-name internships (any key name; `repo` makes it a
  # GitHub list). No pay or company size there, so these qualify by location or priority company.
  # Bump the repo name each season, e.g. Summer2028-Internships.
  - key: github
    repo: SimplifyJobs/Summer2027-Internships
    title_include: *ee_words
    title_exclude: *not_ee

# Check top companies' own career sites too: jobs appear there before aggregators copy
# them. Sites only say which day a job went up, so the first check of a new site just
# records what's there; after that you get each new job. Every site uses these filters.
company_sites:
  title_require: [intern, co-op]
  title_include: *ee_words
  title_exclude: *not_ee
  sites:
    - {company: Apple, careers: apple}
    - {company: NVIDIA, workday: "https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite"}
    - {company: Intel, workday: "https://intel.wd1.myworkdayjobs.com/External"}
    - {company: Micron, workday: "https://micron.wd1.myworkdayjobs.com/External"}
    - {company: Broadcom, workday: "https://broadcom.wd1.myworkdayjobs.com/External_Career"}
    - {company: Northrop Grumman, workday: "https://ngc.wd1.myworkdayjobs.com/Northrop_Grumman_External_Site"}
    - {company: RTX, workday: "https://globalhr.wd5.myworkdayjobs.com/REC_RTX_Ext_Gateway"}  # Raytheon, Collins, Pratt & Whitney
    - {company: Draper, workday: "https://draper.wd5.myworkdayjobs.com/Draper_Careers"}
    # Not checkable directly (their job sites block automated requests, only load in a
    # browser, or use a system without a public feed): Tesla, Lockheed Martin, AMD, Qualcomm
    # and others. They're top companies below, so their jobs on intern-list.com and the
    # GitHub list still get the ★.

# Skip jobs you can't take. These apply before the criteria below.
eligibility:
  graduation: 2028-05     # your graduation (YYYY-MM): skips roles for other grad classes
  skip_phd_only: true

# Only consider jobs posted within this many hours. Each email still only contains jobs
# not emailed before, and each run also looks back past the previous run, so this only
# limits the very first run.
max_age_hours: 2

# How often your scheduler (cron-job.org) runs the check, in minutes. Only used for the
# email wording ("Check back in 30 minutes"); the schedule itself lives in cron-job.org.
check_every_minutes: 30

# Daily digest, at this hour (Eastern). Top-company matches and ones paying at least
# min_hourly_pay are emailed right away; the rest wait for this one morning email.
# Remove the line to get everything right away.
digest_hour: 8

# Send a short "Hi, nothing has been posted!" email after this many hours without any
# email. Remove the line to turn it off.
empty_email_every_hours: 5

# Don't check during these hours, Eastern time: [start, end). Checking resumes at `end`,
# and that run catches up on anything posted while paused.
quiet_hours: [0, 4]

# any = one criterion below is enough; all = every criterion must hold.
match: any

criteria:
  min_hourly_pay: 28            # top of posted range; yearly pay / 2080
  # State codes (CT), metro areas (Bay Area, Los Angeles, San Diego, Seattle, NYC, Boston,
  # Chicago, Austin, DC — suburbs included, see METROS in jobscanner/filters.py) or cities ("Denver, CO").
  # Anywhere in the US: every state plus DC. The favorite places come first only so the email
  # names them ("In Boston" rather than "In MA").
  locations: [
    CT, Boston, NYC, Bay Area, Austin, Seattle, San Diego,
    AL, AK, AZ, AR, CA, CO, DE, DC, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA, ME, MD, MA, MI, MN, MS,
    MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY,
  ]
  # Top-company and large-company matches must also be in `locations` (or remote / no city
  # given). Matches on pay alone can be anywhere.
  company_needs_location: true
  large_company_min_size: 10000 # employees, from the site's size buckets
  priority_companies:           # ranked first; also count as "large company". Every company
                                # under company_sites is one too. A name matches with corporate
                                # words after it ("Intel Corporation"), but other words need
                                # their own entry ("NXP Semiconductors").
    # Analog, mixed-signal and power
    - Texas Instruments
    - Analog Devices
    - Monolithic Power Systems
    - Infineon
    - Allegro MicroSystems
    - Microchip
    - onsemi
    - ON Semiconductor
    - NXP
    - NXP Semiconductors
    - Renesas
    - Renesas Electronics
    - Skyworks
    - Qorvo
    # Chips and computing
    - Qualcomm
    - NVIDIA
    - Apple
    - AMD
    - Advanced Micro Devices
    - Intel
    - Broadcom
    - Marvell
    - Marvell Semiconductor
    - Micron
    - Tesla
    # Defense and aerospace
    - Raytheon
    - RTX
    - Lockheed Martin
    - Northrop Grumman
    - General Dynamics
    - General Dynamics Mission Systems
    - General Dynamics Electric Boat
    - Electric Boat
    - Pratt & Whitney
    - Collins Aerospace
    - Sikorsky
    - Sikorsky Aircraft
    - MIT Lincoln Laboratory
    - Draper
    - Charles Stark Draper Laboratory
    # Chip equipment and test
    - Teradyne
    - KLA
    - Applied Materials
    - Lam Research

# Skills to point out in each email: ✓ ones you have, ✗ ones you don't. Only a highlight;
# it never changes which jobs are sent. Each entry is a name, or [name, other spellings...].
# Names of 4 letters or fewer (C, RTL, FPGA, Java) only match with that exact capitalization,
# and a name must stand alone: Verilog doesn't match inside SystemVerilog, Java not inside JavaScript.
skills:
  have:
    # Digital and computer architecture
    - Verilog
    - [SystemVerilog, System Verilog]
    - [RISC-V, RISCV, RISC V]
    - Computer architecture
    - [Digital design, digital logic, digital logic design, digital circuit design]
    - RTL
    - FPGA
    - Vivado
    - [Icarus Verilog, iverilog]
    - Verilator
    - [Testbenches, testbench]
    - [Basys 3, Basys3]
    - [Artix-7, Artix 7, Artix]
    # Analog and power
    - [Analog circuits, analog circuit, analog circuit design]
    - [Power supplies, power supply, DC-DC, DC/DC]
    - Power electronics
    - Derating
    - LTspice
    - [SPICE, HSPICE, PSpice]
    - MATLAB
    # Boards and embedded
    - [Altium Designer, Altium]
    - [PCB design, PCB layout, PCB]
    - [Embedded firmware, firmware]
    - ESP32
    - ESP-IDF
    - [Wiring harness, wiring harnesses, wire harness, cable harness]
    - [Assembly language, assembly programming, "6502"]
    # Lab
    - [Oscilloscope, oscilloscopes]
    - [Logic analyzer, logic analyzers]
    - [Vector network analyzer, vector network analyzers, VNA]
    - [Bench testing, bench test, lab equipment, test equipment]
    - [Hardware characterization, characterization]
    - Validation
    # Languages and tools
    - C
    - C++
    - Python
    - C#
    - Java
    - [JavaScript, JS]
    - SolidWorks
    - [GitHub, Git]
    - Jira
  # Tools EE postings often ask for that aren't in your list above. A guess: move any you know to `have`.
  lack:
    - [Cadence, Virtuoso, Spectre]
    - [Synopsys, VCS, Design Compiler, PrimeTime]
    - UVM
    - VHDL
    - [Tcl, TCL]
    - Perl
    - LabVIEW
    - Simulink
    - JMP
